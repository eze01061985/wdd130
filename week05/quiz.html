<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Quiz Form</title>
    <meta name="description" content="An online quiz about HTML and CSS basics.">
    <meta name="author" content="Jose Ezequiel Flores Menendez">
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <main>
        <h1>Basic HTML and CSS Quiz</h1>

        <form action="#" method="get">
            <div class="form-item">
                <label for="q1">1. What does HTML stand for?</label>
                <input type="text" id="q1" name="q1">
            </div>

            <div class="form-item">
                <label for="q2">2. Explain the purpose of CSS in a web page.</label>
                <textarea id="q2" name="q2" rows="5"></textarea>
            </div>

            <div class="form-item">
                <label for="q3">3. Which CSS property is used to change the text color?</label>
                <select id="q3" name="q3">
                    <option value="" selected disabled>Choose One ...</option>
                    <option value="font-size">font-size</option>
                    <option value="color">color</option>
                    <option value="background-color">background-color</option>
                </select>
            </div>

            <div class="form-item">
                <label for="q4">4. How many heading levels are available in HTML?</label>
                <input type="number" id="q4" name="q4" step="1">
            </div>

            <button type="submit">Submit Quiz</button>
        </form>
    </main>
</body>

</html>
